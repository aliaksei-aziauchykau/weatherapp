services:
  postgresql:
    image: postgres:16-alpine
    container_name: weatherapp-postgresql
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD}
      POSTGRES_DB: weather
    volumes:
      - weatherapp-pg:/var/lib/postgresql/data
    networks:
      - weatherapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather"]
      interval: 10s
      timeout: 5s
      retries: 5
